<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Life - Login Empleado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 420px;
            width: 100%;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .logo p {
            font-size: 14px;
            color: #666;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: #999;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }

            .logo h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🏥 QR Life</h1>
            <p>Panel de Empleado - STAGING</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="usuario">Usuario o Email</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    required
                    autocomplete="username"
                    placeholder="Ingrese su usuario o email"
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                    placeholder="Ingrese su contraseña"
                >
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                Iniciar Sesión
            </button>

            <div class="loading" id="loading">
                Autenticando...
            </div>
        </form>

        <div class="footer">
            <p>QR Life STAGING &copy; 2026</p>
            <p><small>Ambiente de pruebas - No usar en producción</small></p>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN STAGING
        // ============================================
        const CONFIG = {
            WEB_APP_URL: 'https://script.google.com/macros/s/AKfycbwKSxCnMJVyRHEnsBH05fIY5oeDufecLRGar0NPZj4Ixois1NrCa1dps4zb0K_iiYgw/exec',
            FRONTEND_BASE_URL: 'https://contacto703.github.io/qr-life-formulario-staging',
            PANEL_URL: 'https://contacto703.github.io/qr-life-formulario-staging/panel.html'
        };

        // ============================================
        // ELEMENTOS DOM
        // ============================================
        const loginForm = document.getElementById('loginForm');
        const btnLogin = document.getElementById('btnLogin');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');

        // ============================================
        // VERIFICAR SI YA HAY SESIÓN
        // ============================================
        window.addEventListener('DOMContentLoaded', () => {
            const token = sessionStorage.getItem('qrlife_session_token');
            if (token) {
                console.log('✅ Sesión activa encontrada, redirigiendo al panel...');
                window.location.href = CONFIG.PANEL_URL;
            }
        });

        // ============================================
        // FUNCIÓN: MOSTRAR ERROR
        // ============================================
        function mostrarError(mensaje) {
            errorMessage.textContent = mensaje;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        // ============================================
        // FUNCIÓN: LOGIN
        // ============================================
        async function realizarLogin(usuario, password) {
            try {
                console.log('🔐 Intentando login para:', usuario);

                // Crear URLSearchParams para application/x-www-form-urlencoded
                const params = new URLSearchParams();
                params.append('action', 'login');
                params.append('usuario', usuario);
                params.append('password', password);

                const response = await fetch(CONFIG.WEB_APP_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: params.toString()
                });

                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }

                const resultado = await response.json();
                console.log('📥 Respuesta del servidor:', resultado);

                if (resultado.success) {
                    console.log('✅ Login exitoso');

                    // Guardar session token
                    const sessionToken = resultado.sessionToken;
                    sessionStorage.setItem('qrlife_session_token', sessionToken);
                    sessionStorage.setItem('qrlife_usuario', resultado.usuario || usuario);
                    sessionStorage.setItem('qrlife_empresa', resultado.empresa || '');

                    // Verificar si requiere cambio de password
                    if (resultado.requiereCambio && resultado.redirectUrl) {
                        console.log('⚠️ Requiere cambio de contraseña temporal');
                        window.location.href = resultado.redirectUrl;
                    } else {
                        // Redirigir al panel
                        console.log('📍 Redirigiendo al panel...');
                        window.location.href = CONFIG.PANEL_URL;
                    }
                } else {
                    throw new Error(resultado.error || 'Credenciales incorrectas');
                }

            } catch (error) {
                console.error('❌ Error en login:', error);
                throw error;
            }
        }

        // ============================================
        // EVENTO: SUBMIT FORM
        // ============================================
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value;

            if (!usuario || !password) {
                mostrarError('Por favor complete todos los campos');
                return;
            }

            // Deshabilitar botón y mostrar loading
            btnLogin.disabled = true;
            btnLogin.textContent = 'Autenticando...';
            loading.style.display = 'block';
            errorMessage.style.display = 'none';

            try {
                await realizarLogin(usuario, password);
            } catch (error) {
                mostrarError(error.message || 'Error al iniciar sesión');
                btnLogin.disabled = false;
                btnLogin.textContent = 'Iniciar Sesión';
                loading.style.display = 'none';
            }
        });

        // ============================================
        // LOGGING
        // ============================================
        console.log('🏥 QR Life Login STAGING inicializado');
        console.log('📍 Web App URL:', CONFIG.WEB_APP_URL);
        console.log('📍 Panel URL:', CONFIG.PANEL_URL);
    </script>
</body>
</html>
