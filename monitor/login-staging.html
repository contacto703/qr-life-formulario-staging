<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - QR Life Monitor</title>

    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Work Sans', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }

        .login-container {
            background: #1a1a1a;
            border-radius: 16px;
            border: 1px solid #333333;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            padding: 50px 40px;
            width: 100%;
            max-width: 400px;
        }

        .logo-container { text-align: center; margin-bottom: 30px; }
        .logo {
            height: 80px;
            width: auto;
            filter: drop-shadow(0 0 20px rgba(255, 107, 53, 0.3));
            margin-bottom: 20px;
        }

        .login-title {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .login-subtitle {
            text-align: center;
            color: #b0b0b0;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .form-group { margin-bottom: 25px; }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #b0b0b0;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: #0a0a0a;
            border: 1px solid #333333;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #FF6B35;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #FF6B35 0%, #E55A2B 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 107, 53, 0.4);
        }

        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .error-message {
            background: rgba(255, 23, 68, 0.15);
            border: 1px solid #FF1744;
            border-radius: 8px;
            padding: 12px 16px;
            color: #FF1744;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            animation: shake 0.5s;
        }

        .error-message.show { display: block; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #666666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-container">
            <img src="https://i.imgur.com/FJ4ws55.png" alt="QR Life" class="logo">
        </div>

        <h1 class="login-title">Monitor QR Life - STAGING</h1>
        <p class="login-subtitle">Control de Facturación Firebase</p>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Usuario</label>
                <input
                    type="text"
                    id="usuario"
                    class="form-input"
                    placeholder="Ingresa tu usuario"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label class="form-label">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    class="form-input"
                    placeholder="Ingresa tu contraseña"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                Iniciar Sesión
            </button>
        </form>

        <div class="footer">
            © 2026 QR Life - Todos los derechos reservados
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbw7cdJ_nDIwHUUipUmWbShiArv1m5bUBIyRFpuuNQQXAetq3O76d1rebuPN0E6GXKB1/exec';

        const form = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const btnLogin = document.getElementById('btnLogin');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value;

            if (!usuario || !password) {
                mostrarError('Por favor completa todos los campos');
                return;
            }

            btnLogin.disabled = true;
            btnLogin.innerHTML = '<span class="loading"></span> Verificando...';

            try {
    // Obtener IP y User Agent
    let ipAddress = 'No disponible';
    try {
        const ipResponse = await fetch('https://api.ipify.org?format=json');
        const ipData = await ipResponse.json();
        ipAddress = ipData.ip;
    } catch (e) {
        console.log('No se pudo obtener IP');
    }

    const userAgent = navigator.userAgent;

    const response = await fetch(`${API_URL}?api=monitor&action=login&usuario=${encodeURIComponent(usuario)}&password=${encodeURIComponent(password)}&ip=${encodeURIComponent(ipAddress)}&userAgent=${encodeURIComponent(userAgent)}`);
    const data = await response.json();

                if (data.success) {
    // 🔐 FASE 3B-1: Guardar sesión UUID
    localStorage.setItem('qrlife_monitor_sessionId', data.sessionId);
    localStorage.setItem('qrlife_monitor_usuario', data.usuario);

    // Guardar rol si viene en respuesta
    if (data.rol) {
        localStorage.setItem('qrlife_monitor_rol', data.rol);
    }

    console.log('✅ Login exitoso - SessionID:', data.sessionId.substring(0, 8) + '...');

    window.location.href = 'index-staging.html';
} else {
    let mensaje = data.mensaje || 'Usuario o contraseña incorrectos';

    if (data.bloqueado) {
        mensaje = `🚫 BLOQUEADO: Demasiados intentos fallidos (${data.intentos}). Espera 15 minutos.`;
    } else if (data.intentosRestantes !== undefined) {
        mensaje += ` (Intentos restantes: ${data.intentosRestantes})`;
    }

    mostrarError(mensaje);
    btnLogin.disabled = false;
    btnLogin.innerHTML = 'Iniciar Sesión';
}
            } catch (error) {
                console.error('Error:', error);
                mostrarError('Error de conexión. Intenta nuevamente.');
                btnLogin.disabled = false;
                btnLogin.innerHTML = 'Iniciar Sesión';
            }
        });

        function mostrarError(mensaje) {
            errorMessage.textContent = mensaje;
            errorMessage.classList.add('show');
            setTimeout(() => errorMessage.classList.remove('show'), 5000);
        }

        // Si ya está logueado, redirigir
        if (localStorage.getItem('qrlife_monitor_token')) {
            window.location.href = 'index-staging.html';
        }
    </script>
</body>
</html>
